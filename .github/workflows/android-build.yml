name: Android Unity Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HAS_UNITY_CREDENTIALS: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}

    # The Android build runs only when UNITY_LICENSE, UNITY_EMAIL, and
    # UNITY_PASSWORD secrets are configured. When they are absent — including
    # fork pull requests, which GitHub never exposes secrets to — the job emits
    # a notice and skips the build instead of failing, so main and contributor
    # PRs stay green until a maintainer wires up Unity CI.
    # UWP/HoloLens CI is intentionally omitted for v1 because HL2 is best-effort
    # and hosted UWP runner/licensing cost is not justified yet.
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Skip build without Unity credentials
        if: ${{ env.HAS_UNITY_CREDENTIALS != 'true' }}
        run: |
          echo "::notice::Unity license secrets are not configured, so the Android build is skipped. Set UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD to enable the compile gate."

      # The unityci/editor Android image is large; the hosted runner's ~14 GB
      # free space is not enough and the docker pull fails with "no space left
      # on device" (exit 125). Drop runner-preinstalled toolchains we don't use
      # (the Unity SDK/NDK live inside the container) to free ~25 GB first.
      - name: Free disk space for the Unity image
        if: ${{ env.HAS_UNITY_CREDENTIALS == 'true' }}
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache || true
          sudo docker image prune -af || true
          echo "Disk after cleanup:"; df -h /

      - name: Read Unity version from project
        id: unity_version
        run: echo "version=$(grep 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        if: ${{ env.HAS_UNITY_CREDENTIALS == 'true' }}
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ steps.unity_version.outputs.version }}-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ steps.unity_version.outputs.version }}-Android-

      - name: Build Android player
        if: ${{ env.HAS_UNITY_CREDENTIALS == 'true' }}
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.unity_version.outputs.version }}
          targetPlatform: Android
          buildsPath: build
          buildName: GeoXplorer
          allowDirtyBuild: false
