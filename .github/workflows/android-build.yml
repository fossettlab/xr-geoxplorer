name: Android Unity Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HAS_UNITY_CREDENTIALS: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}

    # The Android build runs only when UNITY_LICENSE, UNITY_EMAIL, and
    # UNITY_PASSWORD secrets are configured. When they are absent — including
    # fork pull requests, which GitHub never exposes secrets to — the job emits
    # a notice and skips the build instead of failing, so main and contributor
    # PRs stay green until a maintainer wires up Unity CI.
    # UWP/HoloLens CI is intentionally omitted for v1 because HL2 is best-effort
    # and hosted UWP runner/licensing cost is not justified yet.
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Skip build without Unity credentials
        if: ${{ env.HAS_UNITY_CREDENTIALS != 'true' }}
        run: |
          echo "::notice::Unity license secrets are not configured, so the Android build is skipped. Set UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD to enable the compile gate."

      - name: Cache Unity Library
        if: ${{ env.HAS_UNITY_CREDENTIALS == 'true' }}
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android player
        if: ${{ env.HAS_UNITY_CREDENTIALS == 'true' }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f2
          targetPlatform: Android
          buildsPath: build
          buildName: GeoXplorer
          allowDirtyBuild: false
