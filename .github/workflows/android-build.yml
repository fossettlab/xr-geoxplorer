name: Android Unity Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 75

    # Repository maintainers must configure UNITY_LICENSE, UNITY_EMAIL, and
    # UNITY_PASSWORD secrets before this gate can pass. UWP/HoloLens CI is
    # intentionally omitted for v1 because HL2 is best-effort and hosted UWP
    # runner/licensing cost is not justified yet.
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f2
          targetPlatform: Android
          buildsPath: build
          buildName: GeoXplorer
          allowDirtyBuild: false
