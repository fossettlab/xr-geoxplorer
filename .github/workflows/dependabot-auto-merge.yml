name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

# Auto-approves and merges ONLY Dependabot patch/minor bumps. Major bumps and
# all human-authored PRs are untouched — they still require a normal review.
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Approve + enable auto-merge (patch & minor only)
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
