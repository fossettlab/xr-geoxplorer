name: Unity Build Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Compile (Unity 2019.4.8f1, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}   # Unity Pro/Plus license
        with:
          unityVersion: 2019.4.8f1
          targetPlatform: Android        # Quest target; the build doubles as the compile gate
          allowDirtyBuild: true
